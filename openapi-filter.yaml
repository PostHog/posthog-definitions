  - feature_flags_partial_update
  - feature_flags_destroy

  # The endpoint resource moved from /api/environments/{id}/endpoints/ to
  # /api/projects/{project_id}/endpoints/ and was renamed environments_endpoints_*
  # → endpoints_*. The old ids no longer exist upstream; kept here (inert) pending
  # human removal per the refresh policy on disappeared operations.
