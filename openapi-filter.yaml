  # DRIFT 2026-09-17: the Team/environment settings singleton was removed from
  # the live spec (Team→Project migration). `environments_retrieve` /
  # `environments_partial_update` and the `Team`/`PatchedTeam` component schemas
  # no longer exist. project-settings now types against the successor
  # `ProjectBackwardCompat`/`PatchedProjectBackwardCompat` schemas, re-provided
  # by the `organizations_projects_*` ids below. The runtime call still targets
  # /api/environments/{id}/ (unchanged, via plain fetch). Kept per the
  # no-auto-delete policy — remove the two ids below once a human confirms.
  - environments_retrieve
  - environments_partial_update

